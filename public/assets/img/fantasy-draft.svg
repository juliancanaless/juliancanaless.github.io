<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#282828">
  <style>
    text { font-family: sans-serif; }
    .title { fill: #ebdbb2; font-size: 22px; font-weight: bold; }
    .sub { fill: #a89984; font-size: 12px; }
    .label { fill: #ebdbb2; font-size: 13px; font-weight: 600; }
    .pick { fill: #ebdbb2; font-size: 11px; }
    .round { fill: #a89984; font-size: 11px; }
    .agent-pick { fill: #1d2021; font-size: 11px; font-weight: 600; }
    .stat-num { font-size: 36px; font-weight: bold; }
    .stat-label { fill: #a89984; font-size: 12px; }
  </style>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">🏈 Fantasy Draft RL Agent</text>
  <text x="400" y="60" text-anchor="middle" class="sub">maskable PPO · 12-team snake draft · 300+ players</text>

  <!-- Draft Board -->
  <g transform="translate(40, 80)">
    <text x="0" y="0" class="label">Draft Board</text>
    
    <!-- Header row -->
    <rect x="0" y="12" width="55" height="24" rx="4" fill="#504945"/>
    <text x="27" y="29" text-anchor="middle" class="round">Round</text>
    <rect x="60" y="12" width="70" height="24" rx="4" fill="#504945"/>
    <text x="95" y="29" text-anchor="middle" class="round">Team 1</text>
    <rect x="135" y="12" width="70" height="24" rx="4" fill="#504945"/>
    <text x="170" y="29" text-anchor="middle" class="round">Team 2</text>
    <rect x="210" y="12" width="70" height="24" rx="4" fill="#fe8019" opacity="0.3"/>
    <text x="245" y="29" text-anchor="middle" class="round" style="fill:#fe8019">🤖 Agent</text>
    <rect x="285" y="12" width="70" height="24" rx="4" fill="#504945"/>
    <text x="320" y="29" text-anchor="middle" class="round">Team 4</text>

    <!-- Round 1 -->
    <text x="20" y="58" text-anchor="middle" class="round">1</text>
    <rect x="60" y="42" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="95" y="57" text-anchor="middle" class="pick">McCaffrey</text>
    <rect x="135" y="42" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="170" y="57" text-anchor="middle" class="pick">Henry</text>
    <rect x="210" y="42" width="70" height="22" rx="4" fill="#d65d0e" opacity="0.9"/>
    <text x="245" y="57" text-anchor="middle" class="agent-pick">Hill</text>
    <rect x="285" y="42" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="320" y="57" text-anchor="middle" class="pick">Jefferson</text>

    <!-- Round 2 (snake - reverse) -->
    <text x="20" y="84" text-anchor="middle" class="round">2</text>
    <rect x="285" y="68" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="320" y="83" text-anchor="middle" class="pick">Kelce</text>
    <rect x="210" y="68" width="70" height="22" rx="4" fill="#d65d0e" opacity="0.9"/>
    <text x="245" y="83" text-anchor="middle" class="agent-pick">Chase</text>
    <rect x="135" y="68" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="170" y="83" text-anchor="middle" class="pick">Adams</text>
    <rect x="60" y="68" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="95" y="83" text-anchor="middle" class="pick">Diggs</text>

    <!-- Round 3 -->
    <text x="20" y="110" text-anchor="middle" class="round">3</text>
    <rect x="60" y="94" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="95" y="109" text-anchor="middle" class="pick">Mixon</text>
    <rect x="135" y="94" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="170" y="109" text-anchor="middle" class="pick">Swift</text>
    <rect x="210" y="94" width="70" height="22" rx="4" fill="#d65d0e" opacity="0.9"/>
    <text x="245" y="109" text-anchor="middle" class="agent-pick">Allen</text>
    <rect x="285" y="94" width="70" height="22" rx="4" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="320" y="109" text-anchor="middle" class="pick">Hurts</text>

    <!-- Snake arrow -->
    <path d="M360,53 L375,53 L375,79 L360,79" fill="none" stroke="#a89984" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M360,79 L375,79 L375,105 L360,105" fill="none" stroke="#a89984" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="388" y="82" class="sub">snake</text>

    <!-- More rows faded -->
    <text x="20" y="136" text-anchor="middle" class="round" opacity="0.5">4</text>
    <rect x="60" y="120" width="295" height="22" rx="4" fill="#3c3836" opacity="0.3"/>
    <text x="207" y="135" text-anchor="middle" class="round" opacity="0.4">· · ·</text>
    <text x="20" y="162" text-anchor="middle" class="round" opacity="0.3">15</text>
    <rect x="60" y="146" width="295" height="22" rx="4" fill="#3c3836" opacity="0.15"/>
  </g>

  <!-- Results section -->
  <g transform="translate(440, 80)">
    <text x="0" y="0" class="label">Results across seasons</text>
    
    <!-- Training years - green -->
    <rect x="0" y="16" width="320" height="75" rx="12" fill="#3c3836" stroke="#504945" stroke-width="1"/>
    <text x="15" y="38" class="stat-label">Training data (2021-2023)</text>
    <text x="15" y="72" class="stat-num" style="fill:#b8bb26">+26%</text>
    <text x="130" y="72" class="stat-label" style="fill:#b8bb26">vs heuristic baseline</text>

    <!-- 2024 - red -->
    <rect x="0" y="100" width="320" height="75" rx="12" fill="#3c3836" stroke="#cc241d" stroke-width="1" opacity="0.8"/>
    <text x="15" y="122" class="stat-label">Unseen 2024 season</text>
    <text x="15" y="156" class="stat-num" style="fill:#fb4934">-17%</text>
    <text x="130" y="156" class="stat-label" style="fill:#fb4934">generalization failure</text>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="720" height="140" rx="16" fill="#3c3836" stroke="#504945" stroke-width="2"/>
    
    <!-- The lesson -->
    <text x="30" y="35" class="label" style="font-size:16px; fill:#fe8019">The takeaway</text>
    <text x="30" y="65" class="pick" style="font-size:14px; fill:#d5c4a1">RL crushed it on historical data but fell apart on a new season.</text>
    <text x="30" y="88" class="pick" style="font-size:14px; fill:#d5c4a1">Fantasy football shifts too fast — player values, strategies, and meta</text>
    <text x="30" y="111" class="pick" style="font-size:14px; fill:#d5c4a1">all change year to year. Some domains just don't reward memorization.</text>

    <!-- Domain shift icon -->
    <g transform="translate(600, 40)">
      <rect x="0" y="0" width="50" height="30" rx="6" fill="#b8bb26" opacity="0.3"/>
      <text x="25" y="20" text-anchor="middle" class="round" style="fill:#b8bb26">2023</text>
      <text x="58" y="20" text-anchor="middle" class="round">→</text>
      <rect x="68" y="0" width="50" height="30" rx="6" fill="#fb4934" opacity="0.3"/>
      <text x="93" y="20" text-anchor="middle" class="round" style="fill:#fb4934">2024</text>
      <text x="60" y="55" text-anchor="middle" class="sub">domain shift</text>
    </g>
  </g>
</svg>
